<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ThuraGirl · Private</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#F4F5F5;--surface:#FFFFFF;--soft:#EFF1F1;--ink:#0F1514;--mute:#5F6967;--accent:#0FBFB6;--bad:#C2410C;--line:#E4E7E6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B0E0E;--surface:#151919;--soft:#1F2424;--ink:#F1F4F3;--mute:#9AA6A3;--accent:#2DD4C8;--bad:#F08A5D;--line:#272D2C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif}
form{width:100%;max-width:360px;background:var(--surface);border-radius:24px;padding:26px;box-shadow:0 24px 60px -30px rgba(0,0,0,.35)}
.dot{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#04201D;font-weight:800;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--mute);font-size:14px}
input{width:100%;font:600 16px "Manrope",sans-serif;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;font:700 15px "Manrope",sans-serif;padding:13px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="dot">T</div>
  <h1>Private page</h1>
  <p>Enter the password to open the budget.</p>
  <label for="pw" style="position:absolute;left:-9999px">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

  async function open(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
