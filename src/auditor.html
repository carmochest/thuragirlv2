<title>ThuraGirl Auditor Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Thai:wght@500;600;700&display=swap">
<style>
  /* Layout: a work desk. Queue of companies on the left, the selected company's document checklist on the right. */
  :root{
    --bg:#F4F5F5; --surface:#FFFFFF; --soft:#EFF1F1; --ink:#0F1514; --mute:#667270; --line:#E2E6E5; --accent:#0FBFB6; --accent-ink:#04201D; --hint:#067A73; --tint:#E3F6F4;

  @media (prefers-color-scheme: dark){

      --bad:#FF8296; --bad-bg:#3A1820; --warn:#F0BC66; --warn-bg:#3A2C12; --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }
  }
  :root[data-theme="dark"]{ --bg:#0B0E0E; --surface:#151919; --soft:#1F2424; --ink:#F1F4F3; --mute:#98A4A1; --line:#293030; --accent:#2DD4C8; --accent-ink:#04201D; --hint:#2DD4C8; --tint:#11302C;
    --bad:#FF8296; --bad-bg:#3A1820; --warn:#F0BC66; --warn-bg:#3A2C12; --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }

  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}

  .num{font-family:var(--num);font-variant-numeric:tabular-nums}
  .i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .wrap{max-width:1320px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.035em}
  .brand b{font-weight:800}
  .brand i{font-style:normal;color:#EC4899}
  .brand span{font:700 11.5px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--surface);border-radius:99px;padding:5px 10px;margin-left:4px}

  .url b{color:var(--ink)}
  .seg{display:inline-flex;background:var(--surface);border-radius:99px;padding:4px;gap:2px}
  .seg button{border:0;background:none;font-weight:700;font-size:13px;color:var(--mute);padding:7px 15px;border-radius:99px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .sp{flex:1}
  .me{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:5px 14px 5px 5px;font-size:13px;font-weight:700}
  .me b{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:10.5px}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stat{background:var(--surface);border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;display:grid;gap:4px}
  .stat[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink)}

  .stat b{font:600 26px var(--num);letter-spacing:-.03em}

  .desk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
  .pane{background:var(--surface);border-radius:26px;padding:16px}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 6px 12px}
  .ph h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .ph small{font-size:12.5px;font-weight:600;color:var(--mute)}
  .search{width:100%;border:0;background:var(--soft);border-radius:14px;padding:11px 14px;font:600 14px var(--font);color:var(--ink);margin-bottom:8px}
  .search::placeholder{color:var(--mute)}
  .q{display:grid;gap:2px}
  .co{width:100%;border:0;background:none;text-align:left;border-radius:18px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;cursor:pointer}
  .co:hover{background:var(--soft)}
  .co[aria-current="true"]{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
  .co .nm{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .co .ty{font-size:12.5px;color:var(--mute);margin-top:2px}
  .co .due{font-size:12.5px;font-weight:700;color:var(--mute);text-align:right;white-space:nowrap}
  .co .due.hot{color:var(--bad)}
  .co .due.ok{color:var(--hint)}
  .co .cnt{font:600 12.5px var(--num);color:var(--mute);text-align:right;margin-top:2px}

  .fs.done{color:var(--hint)} .fs.miss{color:var(--bad)} .fs.ask{color:var(--warn)} .fs.na{opacity:.55} .fs.na::before{display:none}
  .none{padding:28px 12px;text-align:center;color:var(--mute);font-size:14px}

  .tags{display:flex;flex-wrap:wrap;gap:6px}

  .sum dt{font-size:12px;font-weight:700;color:var(--mute)}
  .sum dd{font:600 20px var(--num);letter-spacing:-.02em;margin-top:3px}

  .acts{display:flex;flex-wrap:wrap;gap:8px}

  .btn[disabled]{opacity:.4;cursor:default}
  .btn .i{width:16px;height:16px}
  .back{display:none}

  .sec{border-top:1px solid var(--line)}
  .sh{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:14px 6px;cursor:pointer;text-align:left}
  .sh .t{flex:1;min-width:0}
  .sh b{font-size:15px;font-weight:800;letter-spacing:-.015em}
  .sh small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;font-weight:500}
  .sh .cv{width:16px;height:16px;color:var(--mute);transition:transform .2s}
  .sec.open .sh .cv{transform:rotate(180deg)}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font:700 12px var(--num);white-space:nowrap;background:var(--soft);color:var(--mute)}
  .pill .i{width:13px;height:13px;stroke-width:2}
  .pill.done{background:var(--tint);color:var(--hint)} .pill.miss{background:var(--bad-bg);color:var(--bad)} .pill.ask{background:var(--warn-bg);color:var(--warn)}
  .built{font:700 10.5px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .sb{display:none;padding:0 6px 14px}
  .sec.open .sb{display:grid}
  .doc{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .doc:first-child{border-top:0}
  .doc .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--mute)}
  .doc .ic .i{width:13px;height:13px;stroke-width:2}
  .doc.done .ic{background:var(--tint);color:var(--hint)} .doc.miss .ic{background:var(--bad-bg);color:var(--bad)} .doc.ask .ic{background:var(--warn-bg);color:var(--warn)}
  .doc .tx{flex:1;min-width:0;font-size:14px;line-height:1.4;font-weight:600}
  .doc .tx small{display:block;font-size:12.5px;font-weight:500;color:var(--mute)}
  .doc .mini{border:0;background:var(--soft);border-radius:99px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .doc .mini:hover{background:var(--ink);color:var(--bg)}
  .after{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 0 0;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mute)}
  .after button{border:0;cursor:pointer}
  .trig{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 6px;border-top:1px solid var(--line);font-size:13.5px;font-weight:700}
  .trig small{display:block;font-weight:500;color:var(--mute);font-size:12.5px;margin-top:2px}
  .sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--soft);position:relative;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:transform .18s}
  .sw[aria-checked="true"]{background:var(--accent);box-shadow:none} .sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
  .grp{font:700 11.5px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:18px 6px 8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:11px 18px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:9;max-width:calc(100vw - 32px);text-align:center}
  .toast[hidden]{display:none}
  .foot{font-size:12.5px;line-height:1.55;color:var(--mute);max-width:80ch;padding:0 6px}

  @media (max-width:900px){
    .desk{grid-template-columns:minmax(0,1fr)}
    .desk.detail .left{display:none}
    .desk:not(.detail) .right{display:none}
    .back{display:inline-flex}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .url{display:none}
    .pane{padding:12px;border-radius:22px}
    .doc{flex-wrap:wrap}
    .doc .tx{flex-basis:calc(100% - 34px)}
    .doc .pill{margin-left:32px}
    .me span{display:none} .me{padding:5px}
  }
  @media (prefers-reduced-motion:reduce){ .bar i,.sw::after,.sh .cv{transition:none} }
  .vw{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.38);display:grid;place-items:center;padding:16px}
  .vw[hidden]{display:none}
  .vw-c{background:var(--surface);border-radius:24px;padding:22px;width:min(520px,100%);display:grid;gap:12px;box-shadow:var(--shadow)}
  .vw-c small{color:var(--mute);font-weight:700;font-size:12.5px}
  .vw-c h3{font-size:18px;line-height:1.35}
  .vw-c p{color:var(--mute);font-size:14px;line-height:1.5}
  .vw-d{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
  .vw-d dt{color:var(--mute);font-weight:600}
  .vw-d dd{margin:0;font-weight:600;word-break:break-word}
  .vw-c .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>thuragirl<i>.</i></b><span>Auditor</span></div>
    <div class="url">thuragirl.com<b>/auditor</b></div>
    <div class="sp"></div>
    <div class="seg" id="mode" role="group" aria-label="Close type">
      <button type="button" data-m="month" aria-pressed="true">Monthly close</button>
      <button type="button" data-m="year" aria-pressed="false">Yearly close</button>
    </div>
    <div class="me"><b>SA</b><span>Somchai A., CPA</span></div>
  </header>

  <div class="stats" id="stats" role="group" aria-label="Filter the queue"></div>

  <div class="desk" id="desk">
    <section class="pane left" aria-label="Company queue">
      <div class="ph"><h2>Queue</h2><small id="qn"></small></div>
      <input class="search" id="search" type="search" placeholder="Find a company" aria-label="Find a company">
      <div class="q" id="queue"></div>

    <section class="pane right" id="detail" aria-label="Company documents"></section>
  </div>
  <p class="foot">Sample data. The company list, statuses and due dates are made up to show the layout; the document checklist is the one from your brief. "Request" is drawn as sending a task into the owner's Needs you list in the ThuraGirl app.</p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

          ST[ci + m + f.id + di] = r < c ? (r2 < .62 ? "auto" : "client") : (r2 < .35 ? "ask" : "miss");
        });
        if (co.c >= 2 && m === "month"){ FILED[ci + m + f.id] = 1; CLOSED[ci + m] = 1; AFTER.forEach(function(a, ai){ AFT[ci + m + f.id + ai] = 1; }); }
      });
    });
  });
  TRIGON["0monthpnd54"] = 1;

  // companies that signed up in this browser join the queue, ahead of the samples
  var DB = {}; try { DB = JSON.parse(localStorage.getItem("tg.v2") || "{}"); } catch (e) {}
  var REAL = [];
  Object.keys(DB.users || {}).forEach(function(k){
    var u = DB.users[k]; if (!u.onboarded) return;
    var name = u.path === "new" ? (u.reg && u.reg.names && u.reg.names[0] ? "บริษัท " + u.reg.names[0] + " จำกัด" : "New company (not registered)") : (u.company && u.company.name) || u.email;
    REAL.push({ n: name, t: (u.company && u.company.type ? u.company.type : u.path === "new" ? "Registering" : "Company") + " · signed up in this browser", vat: u.setup && u.setup.vat === "Yes" ? 1 : 0, sso: u.setup && u.setup.sso === "Yes" ? 1 : 0, staff: (u.team || []).length, c: 0, real: k });
  });
  REAL.forEach(function(co, ri){
    var ci = COS.length; COS.push(co);
    var u = DB.users[co.real];
    ["month", "year"].forEach(function(m){
      SETS[m].forms.concat(SETS[m].trig).forEach(function(f){
        f.docs.forEach(function(d, di){
          var k = ci + m + f.id + di, got = m === "month" && (/Bank, card and wallet statements/.test(d) ? (u.banks || []).length : /Payroll register/.test(d) ? (u.team || []).length : /Sales tax invoices/.test(d) ? (u.invoices || []).length : 0);
          ST[k] = got ? "auto" : "miss";
        });
      });
    });
  });
  function reqId(ci, m, f, di){ return "aud:" + m + ":" + f.id + ":" + di; }
  // owners' uploads in answer to a request count as received
  function syncReal(){
    var db2 = {}; try { db2 = JSON.parse(localStorage.getItem("tg.v2") || "{}"); } catch (e) {}
    COS.forEach(function(co, ci){
      if (!co.real) return; var u = (db2.users || {})[co.real]; if (!u) return;
      (u.requests || []).forEach(function(r){ if (!r.aud) return; var k = ci + r.aud; if (r.file && ST[k] === "ask") ST[k] = "client"; if (r.file) FILE[k] = r.file; });
    });
  }
  function pushRequest(ci, m, f, di){
    var co = COS[ci]; if (!co.real) return;
    var db2 = {}; try { db2 = JSON.parse(localStorage.getItem("tg.v2") || "{}"); } catch (e) { return; }
    var u = (db2.users || {})[co.real]; if (!u) return;
    u.requests = u.requests || []; var tag = m + f.id + di;
    if (u.requests.some(function(r){ return r.aud === tag && !r.file; })) return;
    u.requests.push({ id: "a" + Date.now().toString(36) + di, aud: tag, doc: f.docs[di], form: f.name, at: Date.now() });
    try { localStorage.setItem("tg.v2", JSON.stringify(db2)); } catch (e) {}
  }
  var FILE = {}, SAVEKEY = "tg.aud";
  try { var sv = JSON.parse(localStorage.getItem(SAVEKEY) || "null"); if (sv){ ["ST", "FILED", "TRIGON", "AFT", "CLOSED"].forEach(function(n){ var o = sv[n] || {}; var tgt = { ST: ST, FILED: FILED, TRIGON: TRIGON, AFT: AFT, CLOSED: CLOSED }[n]; Object.keys(o).forEach(function(k){ tgt[k] = o[k]; }); }); } } catch (e) {}
  function persist(){ try { localStorage.setItem(SAVEKEY, JSON.stringify({ ST: ST, FILED: FILED, TRIGON: TRIGON, AFT: AFT, CLOSED: CLOSED })); } catch (e) {} }
  syncReal();

  var mode = "month", sel = 0, filter = "all", term = "", open = {};
  function applies(co, f){ return !f.needs || (f.needs === "vat" ? co.vat : f.needs === "sso" ? co.sso : co.staff > 0); }
  function activeForms(ci){
    var co = COS[ci], S = SETS[mode];
    return S.forms.filter(function(f){ return applies(co, f); }).concat(S.trig.filter(function(f){ return TRIGON[ci + mode + f.id]; }));
  }
  function formStat(ci, f){
    var o = { got: 0, ask: 0, miss: 0, n: f.docs.length };
    f.docs.forEach(function(d, di){ var s = ST[ci + mode + f.id + di]; if (s === "miss") o.miss++; else if (s === "ask") o.ask++; else o.got++; });
    o.filed = !!FILED[ci + mode + f.id]; return o;
  }
  function coStat(ci){
    var o = { got: 0, ask: 0, miss: 0, n: 0, filed: 0, forms: 0, due: 99 };
    activeForms(ci).forEach(function(f){
      var s = formStat(ci, f); o.got += s.got; o.ask += s.ask; o.miss += s.miss; o.n += s.n; if (f.id !== "books" && f.id !== "ybooks"){ o.forms++; if (s.filed) o.filed++; }
      if (!s.filed && f.due && f.due < o.due) o.due = f.due;
    });
    o.stage = CLOSED[ci + mode] ? "filed" : (o.miss + o.ask) ? "collect" : "ready"; return o;
  }
  var TODAY = NOW.getDate();
  function dueText(s){
    if (s.stage === "filed") return ["Filed", "ok"];
    if (mode === "year" || s.due === 99) return [s.stage === "ready" ? "Ready to close" : "Collecting", s.stage === "ready" ? "ok" : ""];
    var d = s.due - TODAY; return [d === 0 ? "Due today" : d < 0 ? Math.abs(d) + " days late" : "Due in " + d + " days", d <= 0 ? "hot" : ""];
  }
  var toastT = 0;
  function toast(m){ var t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2600); }

  function renderStats(){
    var c = { all: 0, collect: 0, ready: 0, filed: 0 };
    COS.forEach(function(co, ci){ var s = coStat(ci); c.all++; c[s.stage]++; });
    var root = $("#stats"); root.textContent = "";
    [["all", "All companies"], ["collect", "Waiting on documents"], ["ready", "Ready to close"], ["filed", "Filed"]].forEach(function(x){
      var b = el("button", "stat"); b.type = "button"; b.setAttribute("aria-pressed", String(filter === x[0]));
      b.appendChild(el("span", "", x[1])); b.appendChild(el("b", "num", c[x[0]]));
      b.addEventListener("click", function(){ filter = x[0]; render(); }); root.appendChild(b);
    });
  }
  function renderQueue(){
    var root = $("#queue"); root.textContent = "";
    var rows = COS.map(function(co, ci){ return { co: co, ci: ci, s: coStat(ci) }; })
      .filter(function(r){ return (filter === "all" || r.s.stage === filter) && r.co.n.toLowerCase().indexOf(term) >= 0; })
      .sort(function(a, b){ var o = { collect: 0, ready: 1, filed: 2 }; return (o[a.s.stage] - o[b.s.stage]) || (a.s.due - b.s.due) || (b.s.miss + b.s.ask - a.s.miss - a.s.ask); });
    $("#qn").textContent = rows.length + (rows.length === 1 ? " company" : " companies") + " · most urgent first";
    if (!rows.length) root.appendChild(el("div", "none", "No companies match."));
    rows.forEach(function(r){
      var b = el("button", "co"); b.type = "button"; if (r.ci === sel) b.setAttribute("aria-current", "true");
      var l = el("div"); l.appendChild(el("div", "nm", r.co.n)); l.appendChild(el("div", "ty", r.co.t)); b.appendChild(l);
      var d = dueText(r.s), rt = el("div"); rt.appendChild(el("div", "due " + d[1], d[0])); rt.appendChild(el("div", "cnt", r.s.got + " of " + r.s.n + " documents")); b.appendChild(rt);
      var strip = el("div", "strip");
      SETS[mode].forms.forEach(function(f){
        var ok = applies(r.co, f), fs = ok ? formStat(r.ci, f) : null, cls = !ok ? "na" : fs.filed || !(fs.miss + fs.ask) ? "done" : fs.miss ? "miss" : "ask";
        var word = !ok ? "not needed" : fs.filed ? "filed" : fs.miss ? fs.miss + " missing" : fs.ask ? fs.ask + " requested" : "complete";
        var p = el("span", "fs " + cls, f.short); p.title = f.short + ": " + word; p.setAttribute("aria-label", f.short + ", " + word); strip.appendChild(p);
      });
      b.appendChild(strip);
      b.addEventListener("click", function(){ sel = r.ci; open = {}; $("#desk").classList.add("detail"); render(); window.scrollTo(0, 0); });
      root.appendChild(b);
    });
  }
  function statusPill(s){
    var map = { auto: ["done", "i-check", "From ThuraGirl"], client: ["done", "i-check", "From client"], ask: ["ask", "i-clock", "Requested"], miss: ["miss", "i-x", "Missing"] }[s];
    var p = el("span", "pill " + map[0]); p.innerHTML = ico(map[1]); p.appendChild(document.createTextNode(map[2])); return p;
  }
  function renderDetail(){
    var root = $("#detail"), co = COS[sel], s = coStat(sel), S = SETS[mode]; root.textContent = "";
    var h = el("div", "dh");
    var back = el("button", "btn back"); back.type = "button"; back.innerHTML = ico("i-chevl") + "Queue"; back.style.justifySelf = "start";
    back.addEventListener("click", function(){ $("#desk").classList.remove("detail"); }); h.appendChild(back);
    h.appendChild(el("h2", "", co.n));
    var tags = el("div", "tags");
    [mode === "month" ? PLABEL : FYLABEL, co.vat ? "VAT registered" : "Not VAT registered", co.sso ? "SSO enrolled" : "No SSO", co.staff ? co.staff + " employees" : "No employees"].forEach(function(t){ tags.appendChild(el("span", "tag", t)); });
    h.appendChild(tags);
    var sum = el("dl", "sum");
    [["Received", s.got], ["Requested", s.ask], ["Missing", s.miss]].forEach(function(x){ var d = el("div"); d.appendChild(el("dt", "", x[0])); d.appendChild(el("dd", "num", x[1])); sum.appendChild(d); });
    h.appendChild(sum);
    var bar = el("div", "bar"); bar.setAttribute("role", "img"); bar.setAttribute("aria-label", s.got + " of " + s.n + " documents received"); var fill = el("i"); fill.style.width = (s.n ? s.got / s.n * 100 : 0) + "%"; bar.appendChild(fill); h.appendChild(bar);
    var acts = el("div", "acts");
    var req = el("button", "btn pri"); req.type = "button"; req.innerHTML = ico("i-send") + (s.miss ? "Request " + s.miss + " missing" : "Nothing to request"); req.disabled = !s.miss;
    req.addEventListener("click", function(){ var n = 0; activeForms(sel).forEach(function(f){ f.docs.forEach(function(d, di){ var k = sel + mode + f.id + di; if (ST[k] === "miss"){ ST[k] = "ask"; pushRequest(sel, mode, f, di); n++; } }); }); toast(n + " requests sent to " + who(co.n) + (co.real ? ". They show on their dashboard." : "")); render(); });
    var cls = el("button", "btn"); cls.type = "button"; cls.innerHTML = ico("i-lock") + (s.stage === "filed" ? "Closed" : mode === "month" ? "Close " + PMON : "Close " + FYLABEL); cls.disabled = s.stage !== "ready" || s.filed < s.forms;
    cls.title = s.stage === "filed" ? "Closed" : s.stage !== "ready" ? "Collect every document first" : s.filed < s.forms ? "Mark every form as filed first" : "Lock the books for this period";
    cls.addEventListener("click", function(){ CLOSED[sel + mode] = Date.now(); toast(co.n + ": " + (mode === "month" ? PLABEL : FYLABEL) + " closed"); render(); });
    acts.appendChild(req); acts.appendChild(cls); h.appendChild(acts);
    root.appendChild(h);

    var act = activeForms(sel), auto = act.filter(function(f){ return formStat(sel, f).miss; })[0] || act.filter(function(f){ return formStat(sel, f).ask; })[0];
    function section(f, isTrig){
      var fs = formStat(sel, f), key = f.id, isOpen = open[key] != null ? open[key] : (auto && auto.id === f.id);
      var sec = el("div", "sec" + (isOpen ? " open" : "")), sh = el("button", "sh"); sh.type = "button"; sh.setAttribute("aria-expanded", String(isOpen));
      var t = el("div", "t"), b = el("b", "", f.name); t.appendChild(b); if (f.built) t.insertAdjacentHTML("beforeend", '<span class="built">Built</span>'); t.appendChild(el("small", "", f.sub)); sh.appendChild(t);
      var pc = fs.filed ? "done" : fs.miss ? "miss" : fs.ask ? "ask" : "done", pt = fs.filed ? "Filed" : fs.miss ? fs.miss + " missing" : fs.ask ? fs.ask + " requested" : "Complete";
      var pill = el("span", "pill " + pc); pill.innerHTML = ico(pc === "done" ? "i-check" : pc === "miss" ? "i-x" : "i-clock"); pill.appendChild(document.createTextNode(pt)); sh.appendChild(pill);
      sh.insertAdjacentHTML("beforeend", '<svg class="i cv"><use href="#i-chev"/></svg>');
      sh.addEventListener("click", function(){ open[key] = !isOpen; renderDetail(); }); sec.appendChild(sh);
      var sb = el("div", "sb");
      f.docs.forEach(function(d, di){
        var k = sel + mode + f.id + di, st = ST[k], cl = st === "miss" ? "miss" : st === "ask" ? "ask" : "done";
        var row = el("div", "doc " + cl), ic = el("span", "ic"); ic.innerHTML = ico(cl === "done" ? "i-check" : cl === "miss" ? "i-x" : "i-clock"); row.appendChild(ic);
        row.appendChild(el("div", "tx", d)); row.appendChild(statusPill(st));
        if (st === "miss"){ var a = el("button", "mini", "Request"); a.type = "button"; a.addEventListener("click", function(){ ST[k] = "ask"; pushRequest(sel, mode, f, di); toast("Request sent to " + who(co.n) + (co.real ? ". It shows on their dashboard." : "")); render(); }); row.appendChild(a); }
        else if (st === "ask"){ var a2 = el("button", "mini", "Mark received"); a2.type = "button"; a2.addEventListener("click", function(){ ST[k] = "client"; render(); }); row.appendChild(a2); }
        else { var a3 = el("button", "mini", "View"); a3.type = "button"; a3.addEventListener("click", function(){ viewDoc(co, f, d, st, FILE[k]); }); row.appendChild(a3); }
        sb.appendChild(row);
      });
      if (f.id !== "books" && f.id !== "ybooks"){
        var af = el("div", "after"), complete = !(fs.miss + fs.ask);
        if (!fs.filed){
          var fb = el("button", "btn"); fb.type = "button"; fb.textContent = "Mark " + f.short + " as filed"; fb.disabled = !complete; if (!complete) fb.title = "Collect every document first";
          fb.addEventListener("click", function(){ FILED[sel + mode + f.id] = 1; toast(f.short + " marked as filed"); render(); }); af.appendChild(fb);
          af.appendChild(el("span", "", complete ? "Then collect the filing proof." : "Available once every document is in."));
        } else {
          af.appendChild(el("span", "", "After filing:"));
          AFTER.forEach(function(a, ai){
            var k2 = sel + mode + f.id + ai, on = !!AFT[k2], p = el("button", "pill " + (on ? "done" : "miss")); p.type = "button"; p.innerHTML = ico(on ? "i-check" : "i-x"); p.appendChild(document.createTextNode(a));
            p.setAttribute("aria-pressed", String(on)); p.addEventListener("click", function(){ AFT[k2] = !on; renderDetail(); }); af.appendChild(p);
          });
        }
        sb.appendChild(af);
      }
      sec.appendChild(sb); return sec;
    }
    S.forms.forEach(function(f){
      if (applies(co, f)) root.appendChild(section(f));
      else { var na = el("div", "trig"), t = el("div"); t.appendChild(document.createTextNode(f.name)); t.appendChild(el("small", "", "Not needed: " + (f.needs === "vat" ? "the company is not VAT registered" : f.needs === "sso" ? "the company is not enrolled with SSO" : "the company has no employees"))); na.appendChild(t); var p = el("span", "pill"); p.innerHTML = ico("i-dash") + "Not needed"; na.appendChild(p); root.appendChild(na); }
    });
    if (S.trig.length){
      root.appendChild(el("div", "grp", "Only when triggered"));
      S.trig.forEach(function(f){
        var k = sel + mode + f.id, on = !!TRIGON[k];
        var row = el("div", "trig"), t = el("div"); t.appendChild(document.createTextNode(f.name)); t.appendChild(el("small", "", f.sub)); row.appendChild(t);
        var sw = el("button", "sw"); sw.type = "button"; sw.setAttribute("role", "switch"); sw.setAttribute("aria-checked", String(on)); sw.setAttribute("aria-label", f.name + " applies this month");
        sw.addEventListener("click", function(){ TRIGON[k] = !on; if (!on) open[f.id] = true; render(); }); row.appendChild(sw); root.appendChild(row);
        if (on){ var sc = section(f, true); sc.style.borderTop = "0"; root.appendChild(sc); }
      });
    }
  }
  function render(){ persist(); renderStats(); renderQueue(); renderDetail(); }
  function viewDoc(co, f, d, st, file){
    var m = $("#view"); if (!m){ m = el("div", "vw"); m.id = "view"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); document.body.appendChild(m); m.addEventListener("click", function(ev){ if (ev.target === m) m.hidden = true; }); document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") m.hidden = true; }); }
    m.textContent = ""; m.hidden = false;
    var c = el("div", "vw-c"), x = el("button", "btn", "Close"); x.type = "button"; x.addEventListener("click", function(){ m.hidden = true; });
    c.appendChild(el("small", "", co.n + " · " + f.name)); c.appendChild(el("h3", "", d));
    var dl = el("dl", "vw-d");
    [["Source", st === "auto" ? "Pulled by ThuraGirl from the books" : "Sent by the client"], ["File", file ? file.name : st === "auto" ? (f.id === "books" ? "ledger-" : "") + (f.short || "doc").replace(/[^\w]+/g, "").toLowerCase() + "-" + (mode === "month" ? PMON.toLowerCase() : "fy") + ".pdf" : "Not kept in this test build"], ["Received", file && file.at ? new Date(file.at).toLocaleDateString("en-GB") : "This period"]].forEach(function(r){ dl.appendChild(el("dt", "", r[0])); dl.appendChild(el("dd", "", r[1])); });
    c.appendChild(dl);
    c.appendChild(el("p", "", "Test build: files stay on the client's device, so there is nothing to preview here. In the live app the file opens in this panel."));
    var mk = el("button", "btn", "Mark as missing"); mk.type = "button"; mk.addEventListener("click", function(){ var k = sel + mode + f.id + f.docs.indexOf(d); ST[k] = "miss"; m.hidden = true; render(); });
    var row = el("div", "acts"); row.appendChild(mk); row.appendChild(x); c.appendChild(row);
    m.appendChild(c); setTimeout(function(){ x.focus(); }, 0);
  }
  window.addEventListener("storage", function(ev){ if (ev.key === "tg.v2"){ syncReal(); render(); } });
  function who(n){ return n.replace(/\.$/, ""); }
  [].forEach.call(document.querySelectorAll("#mode button"), function(b){
    b.addEventListener("click", function(){ mode = b.getAttribute("data-m"); open = {}; [].forEach.call(document.querySelectorAll("#mode button"), function(x){ x.setAttribute("aria-pressed", String(x === b)); }); render(); });
  });
  $("#search").addEventListener("input", function(){ term = this.value.trim().toLowerCase(); renderQueue(); });
  var resetB = $("#reset-aud"); if (resetB) resetB.addEventListener("click", function(){ try { localStorage.removeItem(SAVEKEY); } catch (e) {} location.reload(); });
  render();
})();
</script>
